<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X BAR - Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./admin.css">
</head>
<body class="login-page-body">

  <main class="login-card">
    <div class="login-emblem" aria-hidden="true">
      <span class="login-emblem-symbol">x̄</span>
    </div>

    <h1 class="login-title">Admin Login</h1>
    <p class="login-subtitle">Please log in to enter dashboard.</p>

    <form id="loginForm" class="login-form">
      <div class="field-group">
        <label for="loginUsername" class="field-label">Username</label>
        <input type="text" id="loginUsername" class="field-input" placeholder="Enter your username" required autocomplete="username">
      </div>

      <div class="field-group">
        <label for="loginPassword" class="field-label">Password</label>
        <div class="password-wrap">
          <input type="password" id="loginPassword" class="field-input" placeholder="Enter your password" required autocomplete="current-password">
          <button type="button" id="togglePasswordBtn" class="password-toggle-btn" aria-label="Toggle Password Visibility">
            <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="login-forgot-row">
        <button type="button" id="forgotBtn" class="login-forgot-link">Forgot Password?</button>
      </div>

      <div class="login-actions">
        <a href="../index.html" class="btn-pill btn-outline-dark">Kembali ke Website</a>
        <button type="submit" class="btn-pill btn-dark">Login</button>
      </div>
    </form>
  </main>

  <script src="./admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const passInput = document.getElementById('loginPassword');
      const toggleBtn = document.getElementById('togglePasswordBtn');
      const eyeIcon = document.getElementById('eyeIcon');

      toggleBtn.addEventListener('click', function () {
        const isPassword = passInput.type === 'password';
        passInput.type = isPassword ? 'text' : 'password';
        eyeIcon.innerHTML = isPassword
          ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
          : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
      });

      document.getElementById('forgotBtn').addEventListener('click', function () {
        window.XBarAdmin.showToast('Please contact system administrator (cvsudut@gmail.com) to reset password.');
      });

      document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        window.location.href = './dashboard.html';
      });
    });
  </script>
</body>
</html>
